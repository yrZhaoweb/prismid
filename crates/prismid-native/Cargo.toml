[package]
name = "prismid-native"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform native hardware anchor and hypervisor detector for PrismID (macOS, Windows, Linux)."
repository = "https://github.com/yrZhaoweb/prismid"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
